site_name: FMTK
site_description: A modular toolkit for composable foundation model pipelines
site_url: https://umassos.github.io/FMTK/
repo_url: https://github.com/umassos/FMTK
repo_name: umassos/FMTK
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
            show_root_heading: true
            show_source: true
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

# Rebuild the API pages on docstring edits during `mkdocs serve`
watch:
  - src/fmtk

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Core concepts: concepts.md
  - Guides:
      - Training and inference: guides/training.md
      - Adding a backbone: guides/backbones.md
      - Adding a decoder or encoder: guides/decoders.md
  - Reference:
      - Components: reference/components.md
      - Dataset loaders: reference/datasets.md
  - API:
      - Pipeline: api/pipeline.md
      - Base classes: api/base.md
      - Metrics: api/metrics.md
      - Logger: api/logger.md
      - Embedding cache: api/embedding_cache.md
